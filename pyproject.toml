[project]
name = "graphe-code"
version = "0.3.0"
description = "The code graph of a host project: what calls what, what cites what."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Exact versions live in uv.lock; tree-sitter grammars capped at the next minor, as the queries name their node types.
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "scipy>=1.18.1",
    "tree-sitter>=0.26.1,<0.27",
    "tree-sitter-c>=0.24.2,<0.25",
    "tree-sitter-c-sharp>=0.24.0,<0.25",
    "tree-sitter-cpp>=0.23.4,<0.24",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-kotlin>=1.1.0,<2",
    "tree-sitter-php>=0.25.2,<0.26",
    "tree-sitter-ruby>=0.23.1,<0.24",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-swift>=0.7.4,<0.8",
    "tree-sitter-typescript>=0.23.2,<0.24",
]

[project.scripts]
graphe = "graphe:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["graphe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Grid Zero's rules, where the code comes from.
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["E741"]
