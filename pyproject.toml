[project]
name = "graphe"
version = "0.1.0"
description = "The code graph of a host project: what calls what, what cites what."
license = "MIT"
license-files = ["LICENSE"]
# scipy (the layout of large graphs) does not exist yet for 3.15.
requires-python = "==3.14.*"
# Pinned: the communities (Louvain) and the positions of Grid Zero's reference test depend on them.
dependencies = [
    "networkx==3.6.1",
    "numpy==2.4.4",
    "scipy==1.18.1",
    "tree-sitter==0.26.1",
    "tree-sitter-c==0.24.2",
    "tree-sitter-c-sharp==0.24.0",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-php==0.25.2",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-swift==0.7.4",
    "tree-sitter-typescript==0.23.2",
]

[project.scripts]
graphe = "graphe.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["graphe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Grid Zero's rules, where the code comes from.
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["E741"]
