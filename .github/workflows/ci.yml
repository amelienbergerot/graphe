# T-0063 (T-0052's matrix): the tests at the locked versions on the three OS with 3.13 and the newest Python;
# one Linux job at the newest versions the ranges allow; the built wheel installed as a uv tool and run; ruff.
# setup-uv publishes no moving major tag: its exact version.
name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest -q -rs
      # The sample host is graphe itself, its tickets its issues (T-0095): the job's token, not the shared runner's
      # unauthenticated limit.
      - run: uv run --locked graphe build
        env:
          GITHUB_TOKEN: ${{ github.token }}
  # The lint is the same on every OS: one job.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run --locked ruff check
  newest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
      - run: uv sync --upgrade
      # The fixture holds the positions at the locked versions: another numpy or scipy may move them.
      - run: >-
          uv run pytest -q -rs
          --deselect tests/test_host.py::test_the_layout_keeps_the_positions_of_the_tool_before_t_0016
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv build
      - run: uv tool install dist/*.whl
      - run: graphe --help
      - run: graphe build
        env:
          GITHUB_TOKEN: ${{ github.token }}
